
bundle:
  name: proyecto_medallion_ventas

resources:
  jobs:
    etl_medallion_peliculas:
      name: ETL Medallion - Peliculas
      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_ingesta
          notebook_task:
            notebook_path: ./proceso/01_bronze_ingesta.ipynb

        - task_key: silver_transformacion
          depends_on:
            - task_key: bronze_ingesta
          notebook_task:
            notebook_path: ./proceso/02_silver_transformacion.ipynb

        - task_key: gold_analitica
          depends_on:
            - task_key: silver_transformacion
          notebook_task:
            notebook_path: ./proceso/03_gold_analitica.ipynb

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    run_as:
      user_name: jleyvac@utp.edu.pe
    permissions:
      - user_name: jleyvac@utp.edu.pe
        level: CAN_MANAGE
